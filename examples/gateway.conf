# Настройки шлюза (VPS) для gateway/install.sh и gateway/setup-relay.sh.
# Скопируйте в корень репозитория как gateway.conf (он в .gitignore) и заполните.
# Формат — shell: KEY=VALUE, значения с пробелами — в кавычках.
#
# Адреса GATEWAY_*, BACKEND_OVERLAY_IP, RELAY_PORT и SERVICES должны совпадать с backend.conf.

# --- Адреса ------------------------------------------------------------------

# Публичный IPv4 шлюза. На нём HAProxy принимает почтовые порты, с него relay отправляет почту.
# PTR этого адреса = MAIL_HOSTNAME, A-запись MAIL_HOSTNAME (и MX) указывают сюда, адрес входит в SPF.
GATEWAY_PUBLIC_IPV4=203.0.113.10

# Адрес шлюза в оверлейной сети (WireGuard или mesh-VPN).
GATEWAY_OVERLAY_IP=100.64.0.10

# Адрес сервера mailcow (бэкенда) в оверлейной сети: на нём опубликованы PROXY-порты mailcow.
BACKEND_OVERLAY_IP=100.64.0.20

# Интерфейс оверлея на шлюзе (ip -br addr): для WireGuard обычно wg0; у mesh-VPN — свой.
OVERLAY_IFACE=wg0

# systemd-юнит клиента оверлея: HAProxy стартует после него. Для WireGuard — wg-quick@wg0.service,
# для mesh-VPN — служба его клиента. Пусто — не указывать.
OVERLAY_SERVICE=wg-quick@wg0.service

# --- Имена -------------------------------------------------------------------

# Публичное имя mailcow (MAILCOW_HOSTNAME в mailcow.conf). Relay представляется им наружу (HELO).
MAIL_HOSTNAME=mail.example.com

# myhostname relay на шлюзе. ОБЯЗАТЕЛЬНО отличается от MAIL_HOSTNAME: увидев своё имя
# в приветствии relay, mailcow отбросит письмо как "loops back to myself".
# DNS-запись для этого имени не нужна.
RELAY_HOSTNAME=relay.example.com

# --- Публикуемые сервисы -----------------------------------------------------

# Сервисы mailcow, которые публикуются через шлюз (публичный порт -> порт haproxy-listener):
#   smtp 25->10025, smtps 465->10465, submission 587->10587,
#   imap 143->10143, imaps 993->10993, pop3 110->10110, pop3s 995->10995, sieve 4190->14190.
# pop3 (110, STARTTLS) обычно не нужен — достаточно pop3s (995).
SERVICES="smtp smtps submission imap imaps pop3s sieve"

# До переключения MX порт 25 принимает соединения только с адресов из SMTP_ALLOWLIST, чтобы
# внешняя почта не оседала в новом сервере раньше времени. В момент переключения MX — no.
SMTP_ALLOWLIST_ENABLED=yes

# Адреса для тестов на порту 25 (через пробел, a.b.c.d или a.b.c.d/nn). Публичный адрес шлюза
# добавляется автоматически. Добавьте внешний (NAT) адрес офиса, где стоит mailcow: на него
# приходят уведомления watchdog mailcow в собственные домены.
SMTP_ALLOWLIST="198.51.100.7"

# Дополнительные сети, соединения из которых HAProxy отклоняет (к частным и служебным сетям
# из gateway/templates/deny-src.lst). Например, если IPV4_NETWORK в mailcow.conf изменён на
# подсеть вне 10/8, 172.16/12, 192.168/16.
HAPROXY_DENY_SRC_EXTRA=""

# --- HAProxy -----------------------------------------------------------------

HAPROXY_MAXCONN=4000
HAPROXY_TIMEOUT_CONNECT=10s
# Таймаут неактивности для SMTP, POP3, ManageSieve.
HAPROXY_TIMEOUT=10m
# IMAP: клиенты держат IDLE до 29 минут — таймаут должен быть больше.
HAPROXY_TIMEOUT_IMAP=35m

# --- Relay Postfix ----------------------------------------------------------

# Порт relay на шлюзе. Снаружи закрыт таблицей nftables mail_edge, принимает только от бэкенда.
RELAY_PORT=2525

# ipv4 — если у VPS нет PTR для IPv6 (почти всегда): отправка по IPv6 без PTR даёт отказы.
RELAY_INET_PROTOCOLS=ipv4

# Максимальный размер письма, байт (как message_size_limit в mailcow; по умолчанию 100 МБ).
RELAY_MESSAGE_SIZE_LIMIT=104857600
