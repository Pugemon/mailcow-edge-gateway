# Reverse proxy для веба mailcow на обычном nginx (если Nginx Proxy Manager не используется).
# Кладётся на шлюз в /etc/nginx/conf.d/ (контекст http). Подробно — docs/reverse-proxy.md.
#
# Сертификат для веб-имён — свой (certbot / acme.sh, HTTP-01 через этот же nginx), не тот,
# что у mailcow на почтовых портах.

map $http_upgrade $mailcow_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name mail.example.com
                autodiscover.example.com autoconfig.example.com mta-sts.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx >= 1.25.1: "listen 443 ssl;" и отдельной строкой "http2 on;".
    listen 443 ssl http2;
    server_name mail.example.com
                autodiscover.example.com autoconfig.example.com mta-sts.example.com;

    ssl_certificate     /etc/ssl/mailcow-web/fullchain.pem;
    ssl_certificate_key /etc/ssl/mailcow-web/key.pem;

    client_max_body_size 0;

    # ДО ПЕРЕКЛЮЧЕНИЯ MX: автонастройка клиентов закрыта. При переключении MX удалить.
    location ~* ^/(autodiscover/|mail/config-v1\.1\.xml|\.well-known/autoconfig/|Microsoft-Server-ActiveSync) {
        return 404;
    }

    location / {
        # mailcow на бэкенде через оверлей (BACKEND_OVERLAY_IP:MAILCOW_HTTPS_PORT).
        proxy_pass https://100.64.0.20:443;

        # mailcow выбирает виртуальный хост по SNI.
        proxy_ssl_server_name on;
        proxy_ssl_name $host;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx mailcow берёт адрес клиента из X-Forwarded-For (set_real_ip_from = адрес шлюза).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mailcow_connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffer_size 128k;
        proxy_buffers 64 512k;
        proxy_busy_buffers_size 512k;
    }
}
