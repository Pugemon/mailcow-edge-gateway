# Настройки сервера mailcow (бэкенда) для backend/install.sh и backend/issue-cert.sh.
# Скопируйте в корень репозитория как backend.conf (он в .gitignore) и заполните.
# Формат — shell: KEY=VALUE, значения с пробелами — в кавычках.
#
# Адреса GATEWAY_*, BACKEND_OVERLAY_IP, RELAY_PORT и SERVICES должны совпадать с gateway.conf.

# Каталог установки mailcow-dockerized.
MAILCOW_DIR=/opt/mailcow-dockerized

# --- Адреса ------------------------------------------------------------------

# Адрес бэкенда в оверлейной сети: на нём публикуются PROXY-порты mailcow (100xx).
BACKEND_OVERLAY_IP=100.64.0.20

# Адрес шлюза в оверлейной сети: только ему разрешены PROXY-порты; ему доверяют Dovecot
# (haproxy_trusted_networks) и nginx (set_real_ip_from); на нём relay для исходящей почты.
GATEWAY_OVERLAY_IP=100.64.0.10

# Публичный адрес шлюза: единственный внешний адрес, куда контейнерам mailcow разрешён tcp/25.
GATEWAY_PUBLIC_IPV4=203.0.113.10

# Интерфейс оверлея на бэкенде (ip -br addr): для WireGuard обычно wg0; у mesh-VPN — свой.
OVERLAY_IFACE=wg0

# Bridge-интерфейс Docker-сети mailcow (в docker-compose.yml mailcow: com.docker.network.bridge.name).
MAILCOW_BRIDGE=br-mailcow

# --- mailcow -----------------------------------------------------------------

# Публикуемые сервисы — как в gateway.conf. Для невключённых сервисов PROXY-порт остаётся
# на 127.0.0.1.
SERVICES="smtp smtps submission imap imaps pop3s sieve"

# Порт relay на шлюзе: в mailcow будет relayhost = [GATEWAY_OVERLAY_IP]:RELAY_PORT.
RELAY_PORT=2525

# yes — прописать relayhost в data/conf/postfix/extra.cf. До настройки шлюза исходящие письма
# будут ждать в очереди mailcow; напрямую наружу они всё равно не уйдут (tcp/25 закрыт).
CONFIGURE_RELAYHOST=yes

# y — выключить встроенный ACME mailcow (HTTP-01): сертификат получает acme.sh через DNS-01.
SKIP_LETS_ENCRYPT=y

# Порты веба mailcow (HTTP_PORT / HTTPS_PORT в mailcow.conf) — для запрета IPv6 на них.
MAILCOW_HTTP_PORT=80
MAILCOW_HTTPS_PORT=443

# --- Сертификат (backend/issue-cert.sh) --------------------------------------

# Имя в сертификате для почтовых портов (MAILCOW_HOSTNAME).
MAIL_HOSTNAME=mail.example.com

# Дополнительные имена через пробел (обычно не нужны: веб-имена обслуживает сертификат
# reverse proxy на шлюзе).
CERT_EXTRA_NAMES=""

# Каталог acme.sh (там же account.conf с кредами DNS API).
ACME_HOME=/root/.acme.sh

# DNS API acme.sh: имя вида dns_xxx для вашего DNS-провайдера — любой из поддерживаемых acme.sh
# (список и переменные с кредами: https://github.com/acmesh-official/acme.sh/wiki/dnsapi).
ACME_DNS_API=dns_xxx

# CA: letsencrypt. Если в CAA домена разрешён только Let's Encrypt, CA по умолчанию у acme.sh
# (ZeroSSL) не пройдёт.
ACME_SERVER=letsencrypt

# Тип ключа: 2048 (RSA, как у встроенного ACME mailcow — максимальная совместимость
# со старыми клиентами), 4096, ec-256, ec-384.
ACME_KEYLENGTH=2048

# Пауза (сек.) после создания TXT-записи, если DNS провайдера медленно расходится по NS.
# Пусто — acme.sh проверяет появление записи сам.
ACME_DNSSLEEP=""
