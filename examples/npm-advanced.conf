# Nginx Proxy Manager: proxy host для mailcow -> вкладка Advanced -> Custom Nginx Configuration.
# Вставляется целиком. Подробно — docs/reverse-proxy.md.

# mailcow выбирает виртуальный хост по SNI: без этого autodiscover/autoconfig/mta-sts попадут
# в сервер по умолчанию.
proxy_ssl_server_name on;
proxy_ssl_name $host;

# Вложения в SOGo, ActiveSync с долгими запросами (Ping до часа).
client_max_body_size 0;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffer_size 128k;
proxy_buffers 64 512k;
proxy_busy_buffers_size 512k;

# ДО ПЕРЕКЛЮЧЕНИЯ MX: автонастройка клиентов закрыта, чтобы Outlook, Thunderbird и телефоны
# не настроились на новый сервер раньше времени. При переключении MX удалить эту строку.
location ~* ^/(autodiscover/|mail/config-v1\.1\.xml|\.well-known/autoconfig/|Microsoft-Server-ActiveSync) { return 404; }
